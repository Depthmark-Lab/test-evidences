# A squad's Hello World web service, built by the squad's own workflow
# (.github/workflows/hello-python.yml). The platform only sees what it uploads:
# the bundle hello-python.tar.gz and pytest's JUnit report.
[project]
name = "hello-python"
version = "1.0.0"
requires-python = ">=3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
