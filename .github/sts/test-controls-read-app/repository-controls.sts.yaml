# The token .github/workflows/repository-controls.yml gets from the dev broker
# (github-sts-dev.adelisle.com), pool test-controls-read-app, to snapshot this
# repository's controls and who has access with scripts/snapshot-repository.py.
# Read only, for this repository only, from main on a self-hosted runner.
#
# The broker reads this file from the default branch: it takes effect once it
# is on main. members is an organization permission, for the list of owners.
issuer: https://token.actions.githubusercontent.com
claim_pattern:
  job_workflow_ref: '^Depthmark-Lab/test-evidences/\.github/workflows/repository-controls\.yml@refs/heads/main$'
  runner_environment: '^self-hosted$'
audience: github-sts
github:
  sources:
    - owner_id: "71595780"
      repository_id: "1460010558"
  target:
    owner_id: "71595780"
    repository_id: "1460010558"
permissions:
  administration: read
  environments: read
  members: read
  metadata: read
