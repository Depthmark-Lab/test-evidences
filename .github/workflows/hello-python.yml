# A squad's own CI for samples/hello-python, as it would sit in the squad's repository:
#   build     the squad's job: its Python, its pytest flags, its packaging. Only the
#             bundle it built and pytest's JUnit report reach the platform.
#   evidence  the platform's evidence.yml, once per evidence type: hashes and
#             scans the bundle, reads the report, records provenance, and signs
#             it all with Vault Transit
#   verify    a consumer's check: hashes the bundle itself and verifies the
#             envelopes about it with the trusted public keys only
# Each job adds what it did to the run's summary page.
name: hello-python

on:
  push:
    paths:
      - samples/hello-python/**
      - .github/workflows/hello-python.yml
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: [self-hosted, talos, lab]
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: samples/hello-python
    steps:
      - name: 📥 Check out the squad's code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🐍 Set up Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: 🧪 Test, with the squad's own flags
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          python -m pytest -q -p no:cacheprovider --junitxml=reports/junit.xml

      - name: 🔨 Package the service with its dependencies
        run: |
          bundle="$RUNNER_TEMP/hello-python"
          python -m pip install --disable-pip-version-check --no-deps --no-compile \
            --target "$bundle/site-packages" -r requirements.txt
          cp -r hello "$bundle/"
          tar -C "$RUNNER_TEMP" --sort=name --owner=0 --group=0 --numeric-owner --mtime=@0 -cf - hello-python \
            | gzip -n >"$RUNNER_TEMP/hello-python.tar.gz"

      - name: 📤 Hand the bundle over
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hello-python-bundle
          path: ${{ runner.temp }}/hello-python.tar.gz
          if-no-files-found: error

      - name: 📤 Hand the test report over
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hello-python-test-reports
          path: samples/hello-python/reports/junit.xml
          if-no-files-found: error

      - name: 🧾 Describe what was handed over
        run: |
          bundle="$RUNNER_TEMP/hello-python.tar.gz"
          sha256=$(sha256sum "$bundle" | cut -d' ' -f1)
          size=$(stat -c %s "$bundle")
          packages=$(find "$RUNNER_TEMP/hello-python/site-packages" -maxdepth 1 -name '*.dist-info' | wc -l)
          echo "📦 hello-python.tar.gz: $size bytes, $packages packages, sha256:$sha256"
          {
            echo "### 🏗️ hello-python, built by the squad"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| 🐍 Toolchain | $(python --version 2>&1 | tr -d '|`'), pip |"
            echo "| 🧪 Tests | pytest, with the squad's own flags. The platform reads only its JUnit XML |"
            echo "| 📦 Handed over | \`hello-python.tar.gz\`, $size bytes, the service and $packages packages |"
            echo "| 🔒 SHA-256 | \`$sha256\`. The platform computes it again from what it downloads |"
          } >>"$GITHUB_STEP_SUMMARY"

  evidence:
    needs: build
    # One call per evidence type: each gets its own runners, log and summary,
    # and a type that fails stops no other.
    strategy:
      fail-fast: false
      matrix:
        type: [secret-detection, sca, test-results, provenance, provenance-attestation]
    uses: ./.github/workflows/evidence.yml
    # attestations: write for evidence.yml's attest job, which provenance-attestation runs. GitHub
    # checks a called workflow's permissions before any job runs, so every caller grants it.
    permissions:
      contents: read
      pull-requests: read
      id-token: write
      attestations: write
    with:
      type: ${{ matrix.type }}
      subject-repo-path: lab-artifacts/hello-python/${{ github.run_number }}/hello-python.tar.gz
      subject-artifact: hello-python-bundle
      reports-artifact: hello-python-test-reports
      # A parameter the type does not use is refused, so each type gets only its own.
      params: ${{ matrix.type == 'secret-detection' && 'secrets-path=samples/hello-python' || '' }}

  verify:
    needs: [build, evidence]
    # Also when a type failed: verify then says which envelopes hold and which type is missing.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: [self-hosted, talos, lab]
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: 📥 Check out the kit and the trusted public keys
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 📦 Download the bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hello-python-bundle
          path: ${{ runner.temp }}/artifact

      - name: 📥 Download the signed envelopes, one artifact per type
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: evidence-envelopes-*
          merge-multiple: true
          path: ${{ runner.temp }}/envelopes

      # Prints each verified statement in a log group, and adds them to the summary, folded.
      - name: 🛡️ Verify the bundle's evidence with the trusted public keys
        run: |
          sha256=$(sha256sum "$RUNNER_TEMP/artifact/hello-python.tar.gz" | cut -d' ' -f1)
          echo "🔒 SHA-256 of the bundle, computed by the consumer: $sha256"
          python3 evidence/cli.py verify --envelopes "$RUNNER_TEMP/envelopes" --keys trusted-keys \
            --subject-sha256 "$sha256" --types secret-detection,sca,test-results,provenance,provenance-attestation
          echo "::notice title=✅ hello-python.tar.gz verified::5 signed statements about sha256 $sha256 hold with the trusted public keys"
