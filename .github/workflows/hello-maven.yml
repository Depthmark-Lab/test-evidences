# A squad's own CI for samples/hello-maven, as it would sit in the squad's repository:
#   build     the squad's job: its toolchain, its Maven flags, its tests. Only the
#             jar it built and the Surefire reports reach the platform.
#   evidence  the platform's evidence.yml: hashes and scans the jar, reads the
#             reports, records provenance, and signs it all with Vault Transit
#   verify    a consumer's check: hashes the jar itself and verifies the envelopes
#             about it with the trusted public keys only
# Each job adds what it did to the run's summary page.
name: hello-maven

on:
  push:
    paths:
      - samples/hello-maven/**
      - .github/workflows/hello-maven.yml
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: [self-hosted, talos, lab]
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: samples/hello-maven
    steps:
      - name: 📥 Check out the squad's code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ☕ Set up Temurin 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"

      - name: 🔨 Build and test, with the squad's own flags
        env:
          # The platform never sees these flags. It reads the reports they produce.
          MAVEN_ARGS: -B -ntp -Dstyle.color=never -Dsurefire.rerunFailingTestsCount=1
          # The runner container has 512Mi for everything. With default settings, Maven's JVM and
          # Surefire's forked test JVM ran out of it; this applies to both, and fits in 384Mi.
          JAVA_TOOL_OPTIONS: -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:MaxRAMPercentage=25 -Xss512k
        run: ./mvnw verify

      - name: 📤 Hand the jar over
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hello-maven-jar
          path: samples/hello-maven/target/hello-maven.jar
          if-no-files-found: error

      - name: 📤 Hand the test reports over
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hello-maven-test-reports
          path: samples/hello-maven/target/surefire-reports/*.xml
          if-no-files-found: error

      - name: 🧾 Describe what was handed over
        run: |
          jar=target/hello-maven.jar
          sha256=$(sha256sum "$jar" | cut -d' ' -f1)
          size=$(stat -c %s "$jar")
          reports=$(find target/surefire-reports -name '*.xml' | wc -l)
          java=$(java -version 2>&1 | head -1 | tr -d '|`')
          echo "📦 hello-maven.jar: $size bytes, sha256:$sha256, with $reports test reports"
          {
            echo "### 🏗️ hello-maven, built by the squad"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| ☕ Toolchain | $java, Maven wrapper |"
            echo "| 🧪 Tests | Surefire, with the squad's own flags. The platform reads only their JUnit XML |"
            echo "| 📦 Handed over | \`hello-maven.jar\`, $size bytes, and $reports test reports |"
            echo "| 🔒 SHA-256 | \`$sha256\`. The platform computes it again from what it downloads |"
          } >>"$GITHUB_STEP_SUMMARY"

  evidence:
    needs: build
    uses: ./.github/workflows/evidence.yml
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    with:
      types: secret-detection,sca,test-results,provenance
      subject-repo-path: lab-artifacts/hello-maven/${{ github.run_number }}/hello-maven.jar
      subject-artifact: hello-maven-jar
      reports-artifact: hello-maven-test-reports
      params: secrets-path=samples/hello-maven

  verify:
    needs: evidence
    runs-on: [self-hosted, talos, lab]
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: 📥 Check out the kit and the trusted public keys
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 📦 Download the jar
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hello-maven-jar
          path: ${{ runner.temp }}/artifact

      - name: 📥 Download the signed envelopes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: evidence-envelopes
          path: ${{ runner.temp }}/envelopes

      # Prints each verified statement in a log group, and adds them to the summary, folded.
      - name: 🛡️ Verify the jar's evidence with the trusted public keys
        run: |
          sha256=$(sha256sum "$RUNNER_TEMP/artifact/hello-maven.jar" | cut -d' ' -f1)
          echo "🔒 SHA-256 of the jar, computed by the consumer: $sha256"
          python3 evidence/cli.py verify --envelopes "$RUNNER_TEMP/envelopes" --keys trusted-keys \
            --subject-sha256 "$sha256" --types secret-detection,sca,test-results,provenance
          echo "::notice title=✅ hello-maven.jar verified::4 signed statements about sha256 $sha256 hold with the trusted public keys"
