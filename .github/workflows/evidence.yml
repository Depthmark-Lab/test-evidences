# The evidence workflow, and the trust boundary of the lab.
#
# Vault's evidence-<family>-lab roles trust this file by job_workflow_ref, so
# only a job of this workflow can sign. It runs in two jobs:
#   collect  runs the collectors and the scanners, without id-token permission,
#            so nothing it runs can request a signing token.
#   sign     checks each predicate again and signs it with Vault Transit, which
#            holds the private keys. It runs no collector and no scanner.
# The predicates travel from collect to sign as an artifact that sign downloads
# by the id collect's upload returned, never by name: a caller job of the same
# run could upload an artifact with the same name. The signed DSSE envelopes are
# uploaded as the artifact `evidence-envelopes`.
#
# With subject-artifact, the platform downloads the artifact itself, computes
# its SHA-256 and binds every statement to it, sca scans that file, and
# provenance may be asked for. With reports-artifact, test-results reads the
# build's JUnit XML from it. The caller's build produces both; this workflow
# never runs the caller's code.
#
# Lab only: the kit is checked out from this repository at the caller's commit,
# so callers must live in this repository. A caller elsewhere fails at that
# checkout. The production kit pins its action by version instead.
name: evidence

on:
  workflow_call:
    inputs:
      types:
        description: Comma-separated evidence type ids
        required: true
        type: string
      subject-repo-path:
        description: Name of the artifact in the statement, as <repository>/<path to artifact>
        required: true
        type: string
      subject-sha256:
        description: SHA-256 of the artifact. With subject-artifact it may be left empty, and must match when given
        required: false
        type: string
        default: ""
      subject-artifact:
        description: Artifact of this run holding exactly one file, the artifact the evidence is about
        required: false
        type: string
        default: ""
      reports-artifact:
        description: Artifact of this run holding the build's JUnit XML reports, for test-results
        required: false
        type: string
        default: ""
      params:
        description: Collector parameters, one name=value per line
        required: false
        type: string
        default: ""
      source-artifact:
        description: Artifact that holds the files to scan. Empty to scan the caller's repository at its commit
        required: false
        type: string
        default: ""
      enforce:
        description: Fail when a check's result is "fail". The evidence is still signed
        required: false
        type: boolean
        default: false
      runs-on:
        description: Runner labels, as a JSON list
        required: false
        type: string
        default: '["self-hosted", "talos", "lab"]'
    outputs:
      subject-sha256:
        description: SHA-256 of the artifact every statement is about
        value: ${{ jobs.collect.outputs.subject-sha256 }}

permissions: {}

jobs:
  collect:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    outputs:
      subject-sha256: ${{ steps.subject.outputs.sha256 }}
      predicates-id: ${{ steps.hand-off.outputs.artifact-id }}
    steps:
      - name: Check out the kit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Depthmark-Lab/test-evidences
          ref: ${{ github.workflow_sha }}
          path: .evidence-kit
          persist-credentials: false

      - name: Check out the code to scan
        if: inputs.source-artifact == ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          persist-credentials: false

      - name: Download the files to scan
        if: inputs.source-artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.source-artifact }}
          path: source

      - name: Download the artifact the evidence is about
        if: inputs.subject-artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.subject-artifact }}
          path: ${{ runner.temp }}/subject

      - name: Download the build's test reports
        if: inputs.reports-artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.reports-artifact }}
          path: ${{ runner.temp }}/reports

      - name: Pin the subject
        id: subject
        env:
          EVD_IN_TYPES: ${{ inputs.types }}
          EVD_IN_SHA256: ${{ inputs.subject-sha256 }}
          EVD_IN_SUBJECT_ARTIFACT: ${{ inputs.subject-artifact }}
        run: |
          set -euo pipefail
          types=",${EVD_IN_TYPES// /},"
          if [ -n "$EVD_IN_SUBJECT_ARTIFACT" ]; then
            mapfile -t files < <(find "$RUNNER_TEMP/subject" -type f)
            if [ "${#files[@]}" -ne 1 ]; then
              echo "::error::subject-artifact $EVD_IN_SUBJECT_ARTIFACT must hold exactly one file, the artifact, not ${#files[@]}"
              exit 1
            fi
            sha256=$(sha256sum "${files[0]}" | cut -d' ' -f1)
            if [ -n "$EVD_IN_SHA256" ] && [ "$EVD_IN_SHA256" != "$sha256" ]; then
              echo "::error::subject-sha256 is $EVD_IN_SHA256, but $EVD_IN_SUBJECT_ARTIFACT holds a file with SHA-256 $sha256"
              exit 1
            fi
            echo "file=${files[0]}" >>"$GITHUB_OUTPUT"
          else
            if [[ $types == *,provenance,* ]]; then
              echo "::error::provenance needs subject-artifact: the platform vouches only for an artifact it downloaded itself"
              exit 1
            fi
            if ! [[ $EVD_IN_SHA256 =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::pass subject-artifact, or subject-sha256 as 64 lowercase hex characters"
              exit 1
            fi
            sha256=$EVD_IN_SHA256
          fi
          echo "sha256=$sha256" >>"$GITHUB_OUTPUT"
          echo "Every statement is about SHA-256 $sha256"

      - name: Install the scanners
        run: .evidence-kit/scripts/install-scanners.sh "$RUNNER_TEMP/scanners/bin"

      - name: Collect
        id: collect
        working-directory: source
        env:
          # Inputs travel as environment variables, never interpolated into the script.
          EVD_IN_TYPES: ${{ inputs.types }}
          EVD_IN_PARAMS: ${{ inputs.params }}
          EVD_IN_SUBJECT_FILE: ${{ steps.subject.outputs.file }}
          EVD_IN_REPORTS: ${{ inputs.reports-artifact }}
          GH_TOKEN: ${{ github.token }}
          # Outside the work volume, the lab runner pod may write only 4Gi, and Grype's
          # database alone takes 3.3 GB. Past that, Kubernetes evicts the pod mid-scan.
          GRYPE_DB_CACHE_DIR: ${{ runner.temp }}/grype-db
          TMPDIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          args=(collect --types "$EVD_IN_TYPES" --out "$RUNNER_TEMP/predicates")
          while IFS= read -r line; do
            if [ -n "${line//[[:space:]]/}" ]; then args+=(--param "$line"); fi
          done <<<"$EVD_IN_PARAMS"
          types=",${EVD_IN_TYPES// /},"
          # This workflow says where the artifact and the reports are. test-reports is never the
          # caller's: test-results must read what the build uploaded, not files from the repository.
          if grep -q '^[[:space:]]*test-reports[[:space:]]*=' <<<"$EVD_IN_PARAMS"; then
            echo "::error::test-reports is set by evidence.yml from reports-artifact, not by the caller"
            exit 1
          fi
          if [[ $types == *,test-results,* ]]; then
            if [ -z "$EVD_IN_REPORTS" ]; then
              echo "::error::test-results needs reports-artifact, the build's JUnit XML reports"
              exit 1
            fi
            args+=(--param "test-reports=$RUNNER_TEMP/reports")
          fi
          if [[ $types == *,sca,* ]] && [ -n "$EVD_IN_SUBJECT_FILE" ] \
              && ! grep -q '^[[:space:]]*sca-target[[:space:]]*=' <<<"$EVD_IN_PARAMS"; then
            args+=(--param "sca-target=file:$EVD_IN_SUBJECT_FILE")
          fi
          # A type that cannot be collected must not stop the others from being signed.
          code=0
          python3 "$GITHUB_WORKSPACE/.evidence-kit/evidence/cli.py" "${args[@]}" || code=$?
          echo "code=$code" >>"$GITHUB_OUTPUT"

      - name: Hand the predicates to the sign job
        id: hand-off
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-predicates
          path: ${{ runner.temp }}/predicates
          if-no-files-found: ignore
          retention-days: 1
          overwrite: true

      - name: Fail if a type could not be collected
        if: steps.collect.outputs.code != '0'
        run: exit 1

  sign:
    needs: collect
    # Runs after a partial collection too: it signs what was collected and reports the rest.
    # Takes the predicates by the id collect's own upload returned. Without one, because
    # nothing was collected or the collect runner died, there is nothing to sign.
    if: ${{ !cancelled() && needs.collect.outputs.predicates-id != '' }}
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the kit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Depthmark-Lab/test-evidences
          ref: ${{ github.workflow_sha }}
          path: .evidence-kit
          persist-credentials: false

      - name: Download the predicates
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.collect.outputs.predicates-id }}
          path: ${{ runner.temp }}/predicates

      - name: Sign with Vault Transit
        env:
          EVD_IN_TYPES: ${{ inputs.types }}
          EVD_IN_SUBJECT: ${{ inputs.subject-repo-path }}
          EVD_IN_SHA256: ${{ needs.collect.outputs.subject-sha256 }}
          EVD_IN_ENFORCE: ${{ inputs.enforce }}
        run: |
          set -euo pipefail
          args=(sign --types "$EVD_IN_TYPES" --predicates "$RUNNER_TEMP/predicates"
                --subject-repo-path "$EVD_IN_SUBJECT" --subject-sha256 "$EVD_IN_SHA256" --out "$RUNNER_TEMP/envelopes")
          if [ "$EVD_IN_ENFORCE" = "true" ]; then args+=(--enforce); fi
          python3 .evidence-kit/evidence/cli.py "${args[@]}"

      - name: Upload the signed envelopes
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-envelopes
          path: ${{ runner.temp }}/envelopes
          if-no-files-found: ignore
          overwrite: true
