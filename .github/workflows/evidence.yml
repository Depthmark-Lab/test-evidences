# The evidence workflow, and the trust boundary of the lab.
#
# Called once per evidence type, from a matrix in the caller: each type gets its
# own runners, log and summary, installs only the scanner it calls, and a type
# that fails stops no other.
#
# Vault's evidence-<family>-lab roles trust this file by job_workflow_ref, so
# only a job of this workflow can sign. It runs in two jobs, three for
# provenance-attestation and repository-controls:
#   attest         provenance-attestation only: has GitHub attest the artifact's
#                  build provenance with Sigstore, under this workflow's identity.
#                  It runs GitHub's attest action and nothing else.
#   read-controls  repository-controls only: calls repository-snapshot.yml, the
#                  one workflow github-sts gives a token to read the repository's
#                  controls, and hands collect the snapshot.
#   collect  runs the collector and its scanner, without id-token permission,
#            so nothing it runs can request a signing token.
#   sign     checks the predicate again and signs it with Vault Transit, which
#            holds the private keys. It runs no collector and no scanner. Its log
#            follows each step with Vault: the identity token's claims, the
#            login, the key, the bytes signed and Vault's request ids.
# The predicate travels from collect to sign as an artifact that sign downloads
# by the id collect's upload returned, never by name: a caller job of the same
# run could upload an artifact with the same name. The signed DSSE envelope is
# uploaded as the artifact `evidence-envelopes-<type>`; a consumer downloads them
# all with the pattern `evidence-envelopes-*`. Both jobs add what they did to the
# run's summary page: the subject, the scanner, the evidence, and how Vault signed.
#
# With subject-artifact, the platform downloads the artifact itself, computes
# its SHA-256 and binds every statement to it, sca scans that file, and
# provenance and provenance-attestation may be asked for. GitHub keeps
# attestations of a private repository only with GitHub Enterprise Cloud: on
# another plan, the attest job fails there. With reports-artifact, test-results
# reads the build's JUnit XML from it. The caller's build produces both; this
# workflow never runs the caller's code.
#
# The kit is checked out at this file's own commit (job.workflow_repository at
# job.workflow_sha), whichever repository calls it and at whichever ref: the
# code that runs is the code of the job_workflow_ref Vault trusts. A caller in
# another repository needs this repository to be public, since the caller's
# token can read nothing else, and then verifies with verify.yml at the same
# ref. The production kit pins its action by version instead.
name: evidence

on:
  workflow_call:
    inputs:
      type:
        description: One evidence type id. Call this workflow once per type, from a matrix
        required: true
        type: string
      subject-repo-path:
        description: Name of the artifact in the statement, as <repository>/<path to artifact>
        required: true
        type: string
      subject-sha256:
        description: SHA-256 of the artifact. With subject-artifact it may be left empty, and must match when given
        required: false
        type: string
        default: ""
      subject-artifact:
        description: Artifact of this run holding exactly one file, the artifact the evidence is about
        required: false
        type: string
        default: ""
      reports-artifact:
        description: Artifact of this run holding the build's JUnit XML reports. Only test-results reads it
        required: false
        type: string
        default: ""
      params:
        description: Collector parameters, one name=value per line
        required: false
        type: string
        default: ""
      source-artifact:
        description: Artifact that holds the files to scan. Empty to scan the caller's repository at its commit
        required: false
        type: string
        default: ""
      enforce:
        description: Fail when a check's result is "fail". The evidence is still signed
        required: false
        type: boolean
        default: false
      runs-on:
        description: Runner labels, as a JSON list
        required: false
        type: string
        default: '["self-hosted", "talos", "lab"]'
    outputs:
      subject-sha256:
        description: SHA-256 of the artifact every statement is about
        value: ${{ jobs.collect.outputs.subject-sha256 }}

permissions: {}

jobs:
  attest:
    name: 🪪 Attest with GitHub
    # GitHub signs SLSA build provenance for the artifact with Sigstore, under this workflow's
    # identity, and keeps it with the repository; collect then verifies it. Nothing here runs
    # a collector, a scanner or the caller's code. Every caller must grant attestations: write,
    # whatever its type: GitHub checks a called workflow's permissions before any job runs.
    if: inputs.type == 'provenance-attestation'
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: 📦 Download the artifact the evidence is about
        if: inputs.subject-artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.subject-artifact }}
          path: ${{ runner.temp }}/subject

      - name: 🎯 Hash it
        id: subject
        env:
          EVD_IN_SUBJECT_ARTIFACT: ${{ inputs.subject-artifact }}
        run: |
          set -euo pipefail
          if [ -z "$EVD_IN_SUBJECT_ARTIFACT" ]; then
            echo "::error::provenance-attestation needs subject-artifact: GitHub attests only an artifact the platform downloaded itself"
            exit 1
          fi
          mapfile -t files < <(find "$RUNNER_TEMP/subject" -type f)
          if [ "${#files[@]}" -ne 1 ]; then
            echo "::error::subject-artifact $EVD_IN_SUBJECT_ARTIFACT must hold exactly one file, the artifact, not ${#files[@]}"
            exit 1
          fi
          sha256=$(sha256sum "${files[0]}" | cut -d' ' -f1)
          echo "sha256=$sha256" >>"$GITHUB_OUTPUT"
          echo "🔒 SHA-256 computed here, from the downloaded file: $sha256"

      # Adds the attestation's link to the summary. Fails where GitHub keeps no attestations.
      - name: 🪪 Have GitHub attest its build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ inputs.subject-repo-path }}
          subject-digest: sha256:${{ steps.subject.outputs.sha256 }}

  read-controls:
    name: 📸 Read the repository's controls
    # repository-snapshot.yml is the only workflow github-sts gives a token to read them.
    # Called from here, the token still goes to its job alone; collect gets the snapshot.
    if: inputs.type == 'repository-controls'
    uses: ./.github/workflows/repository-snapshot.yml
    permissions:
      contents: read
      id-token: write
    with:
      artifact-name: evidence-controls-${{ inputs.type }}
      runs-on: ${{ inputs.runs-on }}

  collect:
    name: 🔎 Collect
    needs: [attest, read-controls]
    # attest and read-controls run for one type each and are skipped otherwise. When one
    # of them fails, there is nothing to collect from.
    if: >-
      ${{ !cancelled()
      && (needs.attest.result == 'success' || needs.attest.result == 'skipped')
      && (needs.read-controls.result == 'success' || needs.read-controls.result == 'skipped') }}
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      attestations: read
    outputs:
      subject-sha256: ${{ steps.subject.outputs.sha256 }}
      predicates-id: ${{ steps.hand-off.outputs.artifact-id }}
    steps:
      # This file's own commit, not the caller's: github.workflow_sha belongs to the caller.
      - name: 📥 Check out the kit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .evidence-kit
          persist-credentials: false

      - name: 📥 Check out the code to scan
        if: inputs.source-artifact == ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          persist-credentials: false

      - name: 📥 Download the files to scan
        if: inputs.source-artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.source-artifact }}
          path: source

      - name: 📦 Download the artifact the evidence is about
        if: inputs.subject-artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.subject-artifact }}
          path: ${{ runner.temp }}/subject

      - name: 🧪 Download the build's test reports
        if: inputs.reports-artifact != '' && inputs.type == 'test-results'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.reports-artifact }}
          path: ${{ runner.temp }}/reports

      # By the id read-controls' own upload returned, never by name, as sign takes the predicate.
      - name: 📸 Download the controls snapshot
        if: inputs.type == 'repository-controls'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.read-controls.outputs.snapshot-id }}
          path: ${{ runner.temp }}/controls

      - name: 🎯 Pin the subject
        id: subject
        env:
          EVD_IN_TYPE: ${{ inputs.type }}
          EVD_IN_SUBJECT: ${{ inputs.subject-repo-path }}
          EVD_IN_SHA256: ${{ inputs.subject-sha256 }}
          EVD_IN_SUBJECT_ARTIFACT: ${{ inputs.subject-artifact }}
        run: |
          set -euo pipefail
          # Callers name the subject and the artifact: what would be Markdown goes before the summary.
          plain() { printf '%s' "$1" | tr -d '`|<>[]\r\n'; }
          if ! [[ $EVD_IN_TYPE =~ ^[a-z][a-z0-9-]*$ ]]; then
            echo "::error::type is '$(plain "$EVD_IN_TYPE")': pass one evidence type id, and call evidence.yml once per type"
            exit 1
          fi
          if [ -n "$EVD_IN_SUBJECT_ARTIFACT" ]; then
            mapfile -t files < <(find "$RUNNER_TEMP/subject" -type f)
            if [ "${#files[@]}" -ne 1 ]; then
              echo "::error::subject-artifact $EVD_IN_SUBJECT_ARTIFACT must hold exactly one file, the artifact, not ${#files[@]}"
              exit 1
            fi
            sha256=$(sha256sum "${files[0]}" | cut -d' ' -f1)
            if [ -n "$EVD_IN_SHA256" ] && [ "$EVD_IN_SHA256" != "$sha256" ]; then
              echo "::error::subject-sha256 is $EVD_IN_SHA256, but $EVD_IN_SUBJECT_ARTIFACT holds a file with SHA-256 $sha256"
              exit 1
            fi
            echo "file=${files[0]}" >>"$GITHUB_OUTPUT"
            size=$(wc -c <"${files[0]}" | tr -d " ")
            echo "📦 ${files[0]##*/}, $size bytes, from the artifact $EVD_IN_SUBJECT_ARTIFACT of this run"
            echo "🔒 SHA-256 computed here, from the downloaded file: $sha256"
            origin="computed here, from the downloaded file"
            artifact="\`$(plain "${files[0]##*/}")\`, $size bytes, from the artifact \`$(plain "$EVD_IN_SUBJECT_ARTIFACT")\` of this run"
          else
            if [ "$EVD_IN_TYPE" = provenance ] || [ "$EVD_IN_TYPE" = provenance-attestation ]; then
              echo "::error::$EVD_IN_TYPE needs subject-artifact: the platform vouches only for an artifact it downloaded itself"
              exit 1
            fi
            if ! [[ $EVD_IN_SHA256 =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::pass subject-artifact, or subject-sha256 as 64 lowercase hex characters"
              exit 1
            fi
            sha256=$EVD_IN_SHA256
            echo "✍️ SHA-256 given by the caller, not computed here: $sha256"
            origin="given by the caller, not computed here"
            artifact="not handed over: the platform did not see it"
          fi
          echo "sha256=$sha256" >>"$GITHUB_OUTPUT"
          echo "🎯 The statement is about $EVD_IN_SUBJECT, SHA-256 $sha256"
          {
            echo "### 🎯 What the evidence is about"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| 🏷️ Name | \`$(plain "$EVD_IN_SUBJECT")\` |"
            echo "| 🔒 SHA-256 | \`$sha256\`, $origin |"
            echo "| 📦 Artifact | $artifact |"
            echo "| 📋 Type | \`$EVD_IN_TYPE\` |"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: 🧰 Install the tool the collector calls
        env:
          EVD_IN_TYPE: ${{ inputs.type }}
        run: |
          set -euo pipefail
          # Only the tool this type calls: its scanner, or gh to verify GitHub's attestation.
          bin=$RUNNER_TEMP/scanners/bin
          case "$EVD_IN_TYPE" in
            secret-detection)
              .evidence-kit/scripts/install-scanners.sh "$bin" trufflehog
              role=Scanner tool="TruffleHog $("$bin/trufflehog" --version 2>&1 | awk '{print $NF}')" ;;
            sca)
              .evidence-kit/scripts/install-scanners.sh "$bin" grype
              role=Scanner tool="Grype $("$bin/grype" version | awk '$1 == "Version:" {print $2}')" ;;
            provenance-attestation)
              .evidence-kit/scripts/install-scanners.sh "$bin" gh
              role=Verifier tool="gh $("$bin/gh" --version | awk 'NR == 1 {print $3}')" ;;
            *)
              echo "🧰 $EVD_IN_TYPE calls no tool"
              exit 0 ;;
          esac
          echo "🧰 $tool, its archive checked against its pinned SHA-256"
          printf '\n🧰 **%s** %s, its archive checked against its pinned SHA-256\n' "$role" "$tool" >>"$GITHUB_STEP_SUMMARY"

      - name: 🔎 Collect
        working-directory: source
        env:
          # Inputs travel as environment variables, never interpolated into the script.
          EVD_IN_TYPE: ${{ inputs.type }}
          EVD_IN_PARAMS: ${{ inputs.params }}
          EVD_IN_SUBJECT_FILE: ${{ steps.subject.outputs.file }}
          EVD_IN_REPORTS: ${{ inputs.reports-artifact }}
          GH_TOKEN: ${{ github.token }}
          # Outside the work volume, the lab runner pod may write only 4Gi, and Grype's
          # database alone takes 3.3 GB. Past that, Kubernetes evicts the pod mid-scan.
          GRYPE_DB_CACHE_DIR: ${{ runner.temp }}/grype-db
          TMPDIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          args=(collect --types "$EVD_IN_TYPE" --out "$RUNNER_TEMP/predicates")
          while IFS= read -r line; do
            if [ -n "${line//[[:space:]]/}" ]; then args+=(--param "$line"); fi
          done <<<"$EVD_IN_PARAMS"
          # This workflow says where the artifact, the reports and the snapshot are, and who must
          # have attested, never the caller: test-results must read what the build uploaded, not
          # files from the repository, provenance-attestation must hold GitHub's attestation to
          # this workflow, and repository-controls must read what read-controls took.
          for name in test-reports attested-file attestation-signer controls-snapshot; do
            if grep -q "^[[:space:]]*${name}[[:space:]]*=" <<<"$EVD_IN_PARAMS"; then
              echo "::error::$name is set by evidence.yml, not by the caller"
              exit 1
            fi
          done
          if [ "$EVD_IN_TYPE" = test-results ]; then
            if [ -z "$EVD_IN_REPORTS" ]; then
              echo "::error::test-results needs reports-artifact, the build's JUnit XML reports"
              exit 1
            fi
            args+=(--param "test-reports=$RUNNER_TEMP/reports")
          fi
          if [ "$EVD_IN_TYPE" = sca ] && [ -n "$EVD_IN_SUBJECT_FILE" ] \
              && ! grep -q '^[[:space:]]*sca-target[[:space:]]*=' <<<"$EVD_IN_PARAMS"; then
            args+=(--param "sca-target=file:$EVD_IN_SUBJECT_FILE")
          fi
          if [ "$EVD_IN_TYPE" = provenance-attestation ]; then
            args+=(--param "attested-file=$EVD_IN_SUBJECT_FILE"
                   --param "attestation-signer=Depthmark-Lab/test-evidences/.github/workflows/evidence.yml")
          fi
          if [ "$EVD_IN_TYPE" = repository-controls ]; then
            args+=(--param "controls-snapshot=$RUNNER_TEMP/controls/repository-controls.json")
          fi
          echo "::group::🔧 What collect was asked for"
          printf '%s\n' "${args[@]}"
          echo "::endgroup::"
          python3 "$GITHUB_WORKSPACE/.evidence-kit/evidence/cli.py" "${args[@]}"
          echo "📤 $EVD_IN_TYPE.json goes to the sign job"

      - name: 📤 Hand the predicate to the sign job
        id: hand-off
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-predicates-${{ inputs.type }}
          path: ${{ runner.temp }}/predicates
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  sign:
    name: 🔏 Sign with Vault Transit
    needs: collect
    # Takes the predicate by the id collect's own upload returned. An empty id would make
    # download-artifact take every artifact of the run, so without one nothing is signed.
    # The status is explicit: the default success() would skip sign whenever attest was skipped.
    if: ${{ !cancelled() && needs.collect.result == 'success' && needs.collect.outputs.predicates-id != '' }}
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      # This file's own commit, not the caller's: github.workflow_sha belongs to the caller.
      - name: 📥 Check out the kit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .evidence-kit
          persist-credentials: false

      - name: 📥 Download the predicate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.collect.outputs.predicates-id }}
          path: ${{ runner.temp }}/predicates

      - name: 🔏 Sign with Vault Transit
        env:
          EVD_IN_TYPE: ${{ inputs.type }}
          EVD_IN_SUBJECT: ${{ inputs.subject-repo-path }}
          EVD_IN_SHA256: ${{ needs.collect.outputs.subject-sha256 }}
          EVD_IN_ENFORCE: ${{ inputs.enforce }}
        run: |
          set -euo pipefail
          args=(sign --types "$EVD_IN_TYPE" --predicates "$RUNNER_TEMP/predicates"
                --subject-repo-path "$EVD_IN_SUBJECT" --subject-sha256 "$EVD_IN_SHA256" --out "$RUNNER_TEMP/envelopes")
          if [ "$EVD_IN_ENFORCE" = "true" ]; then args+=(--enforce); fi
          # The log follows each step with Vault: the identity token's claims, which Vault's role
          # checks, the login, the key, the bytes signed and Vault's request ids.
          python3 .evidence-kit/evidence/cli.py "${args[@]}"

      # Also when enforce failed the step: the evidence is signed all the same.
      - name: 📤 Upload the signed envelope
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-envelopes-${{ inputs.type }}
          path: ${{ runner.temp }}/envelopes
          if-no-files-found: ignore
          overwrite: true
