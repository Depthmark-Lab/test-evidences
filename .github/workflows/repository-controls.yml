# This repository's controls, snapshot every day by repository-snapshot.yml, the
# one workflow github-sts gives a token to read them: its settings, the rules on
# main and their rulesets, what workflows may do, who has access and how, deploy
# keys, and who may approve deployments.
#
# With controls/repository-controls.json committed, the job fails when the live
# controls differ from it, and its summary shows the difference. Without it, the
# job uploads the snapshot, to review and commit as the declared state.
name: repository-controls

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  snapshot:
    uses: ./.github/workflows/repository-snapshot.yml
    permissions:
      contents: read
      id-token: write
    with:
      check: controls/repository-controls.json
