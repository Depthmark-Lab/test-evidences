# A squad's own CI for samples/hello-node, as it would sit in the squad's repository:
#   build     the squad's job: its Node, its test runner flags, its packaging. Only
#             the bundle it built and the JUnit report reach the platform.
#   evidence  the platform's evidence.yml, once per evidence type: hashes and
#             scans the bundle, reads the report, records provenance, and signs
#             it all with Vault Transit
#   verify    a consumer's check: hashes the bundle itself and verifies the
#             envelopes about it with the trusted public keys only
# Each job adds what it did to the run's summary page.
name: hello-node

on:
  push:
    paths:
      - samples/hello-node/**
      - .github/workflows/hello-node.yml
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: [self-hosted, talos, lab]
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: samples/hello-node
    steps:
      - name: 📥 Check out the squad's code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node 25 and later need libatomic.so.1, which the runner image lacks and a job
      # without root cannot install: setup-node fails with exit code 127.
      - name: 🟩 Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: 🧪 Test, with the squad's own flags
        run: |
          npm ci --no-audit --no-fund
          mkdir -p reports
          node --test --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=junit --test-reporter-destination=reports/junit.xml

      - name: 🔨 Package the service with its production dependencies
        run: |
          bundle="$RUNNER_TEMP/hello-node"
          mkdir -p "$bundle"
          cp -r package.json package-lock.json src "$bundle/"
          (cd "$bundle" && npm ci --omit=dev --no-audit --no-fund)
          tar -C "$RUNNER_TEMP" --sort=name --owner=0 --group=0 --numeric-owner --mtime=@0 -cf - hello-node \
            | gzip -n >"$RUNNER_TEMP/hello-node.tar.gz"

      - name: 📤 Hand the bundle over
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hello-node-bundle
          path: ${{ runner.temp }}/hello-node.tar.gz
          if-no-files-found: error

      - name: 📤 Hand the test report over
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hello-node-test-reports
          path: samples/hello-node/reports/junit.xml
          if-no-files-found: error

      - name: 🧾 Describe what was handed over
        run: |
          bundle="$RUNNER_TEMP/hello-node.tar.gz"
          sha256=$(sha256sum "$bundle" | cut -d' ' -f1)
          size=$(stat -c %s "$bundle")
          echo "📦 hello-node.tar.gz: $size bytes, sha256:$sha256"
          {
            echo "### 🏗️ hello-node, built by the squad"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| 🟩 Toolchain | Node $(node --version | tr -d '|`'), npm $(npm --version | tr -d '|`') |"
            echo "| 🧪 Tests | node --test, with the squad's own flags. The platform reads only its JUnit XML |"
            echo "| 📦 Handed over | \`hello-node.tar.gz\`, $size bytes, the service and its production packages |"
            echo "| 🔒 SHA-256 | \`$sha256\`. The platform computes it again from what it downloads |"
          } >>"$GITHUB_STEP_SUMMARY"

  evidence:
    needs: build
    # One call per evidence type: each gets its own runners, log and summary,
    # and a type that fails stops no other.
    strategy:
      fail-fast: false
      matrix:
        type: [secret-detection, sca, test-results, provenance, provenance-attestation]
    uses: ./.github/workflows/evidence.yml
    # attestations: write for evidence.yml's attest job, which provenance-attestation runs. GitHub
    # checks a called workflow's permissions before any job runs, so every caller grants it.
    permissions:
      contents: read
      pull-requests: read
      id-token: write
      attestations: write
    with:
      type: ${{ matrix.type }}
      subject-repo-path: lab-artifacts/hello-node/${{ github.run_number }}/hello-node.tar.gz
      subject-artifact: hello-node-bundle
      reports-artifact: hello-node-test-reports
      # A parameter the type does not use is refused, so each type gets only its own.
      params: ${{ matrix.type == 'secret-detection' && 'secrets-path=samples/hello-node' || '' }}

  verify:
    needs: [build, evidence]
    # Also when a type failed: verify then says which envelopes hold and which type is missing.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: [self-hosted, talos, lab]
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: 📥 Check out the kit and the trusted public keys
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 📦 Download the bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hello-node-bundle
          path: ${{ runner.temp }}/artifact

      - name: 📥 Download the signed envelopes, one artifact per type
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: evidence-envelopes-*
          merge-multiple: true
          path: ${{ runner.temp }}/envelopes

      # Prints each verified statement in a log group, and adds them to the summary, folded.
      - name: 🛡️ Verify the bundle's evidence with the trusted public keys
        run: |
          sha256=$(sha256sum "$RUNNER_TEMP/artifact/hello-node.tar.gz" | cut -d' ' -f1)
          echo "🔒 SHA-256 of the bundle, computed by the consumer: $sha256"
          python3 evidence/cli.py verify --envelopes "$RUNNER_TEMP/envelopes" --keys trusted-keys \
            --subject-sha256 "$sha256" --types secret-detection,sca,test-results,provenance,provenance-attestation
          echo "::notice title=✅ hello-node.tar.gz verified::5 signed statements about sha256 $sha256 hold with the trusted public keys"
