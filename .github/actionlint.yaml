# Labels of the ARC scale sets on the Talos cluster (homelab repository,
# talos/apps/action-runner-controller-dev/gha-runner-scale-set-lab*).
self-hosted-runner:
  labels:
    - talos
    - lab
    - lab-k8s
# job.workflow_repository and job.workflow_sha, the called workflow's own
# repository and commit, are in GitHub's contexts reference, but actionlint
# 1.7.12 does not know them yet.
paths:
  .github/workflows/evidence.yml:
    ignore:
      - 'property "workflow_(repository|sha)" is not defined in object type'
  .github/workflows/verify.yml:
    ignore:
      - 'property "workflow_(repository|sha)" is not defined in object type'
